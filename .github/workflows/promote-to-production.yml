name: Promote to Production

# One-dispatch prod promotion: platform (staging→main BUILD) then image (:version→:latest
# + prod OpenClawVersion isStable). Replaces the manual #265 + promote-openclaw-image sequence.
#
# MIGRATION RULE: the platform job MUST create a real Production BUILD from the merge
# commit on main (Vercel git integration). NEVER promote a Preview/staging artifact to
# Production — that would skip prod build env, migrations, and commit provenance.
#
# Dispatchability note: workflow_dispatch reads the DEFAULT BRANCH (main) copy of this
# file. This workflow is only runnable AFTER it lands on main via a normal staging→main
# promotion (chicken/egg for the first ship).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Runtime version already stable on staging (e.g. 2026.5.22-7). Must exist as :<version> in GHCR.'
        required: true
        type: string
      confirm:
        description: 'Type PROMOTE-PROD exactly to proceed (deliberate-action gate).'
        required: true
        type: string
      migrations_ack:
        description: 'Required when prisma/migrations/ differs between main and staging. Type ACK-MIGRATIONS exactly to proceed with migrations aboard; leave empty when the diff is empty.'
        required: false
        type: string
        default: ''
      skip_candidate_check:
        description: 'Emergency override: skip :candidate digest == :<version> gate (same semantics as promote-openclaw-image.yml).'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Rehearsal mode: preflight+guard run for real; platform/image echo side-effecting commands; probes run health+stable GET only and echo the rest. No prod window.'
        required: false
        type: boolean
        default: false

# Two promotions must never overlap (platform/image window is order-sensitive).
concurrency:
  group: promote-to-production
  cancel-in-progress: false

# Workflow-level grant. packages: write is required because the image job calls
# promote-openclaw-image.yml (callee declares packages: write). Reusable-workflow
# permissions can only be downgraded by the caller, never elevated — violations
# are BOOT-TIME startup_failures with zero jobs and zero logs (maiden run
# 29266873589).
#
# Wait-then-merge poll APIs → required scopes (round-4 / run 29331408200):
#   - `gh pr view --json statusCheckRollup` (GraphQL statusCheckRollup)
#       → checks: read  +  statuses: read
#         (CheckRun nodes need checks; commit StatusContext nodes need statuses.
#          Missing either → "Resource not accessible by integration".)
#   - `gh pr checks "$PR"` (REST Checks API — timeout/failure diagnostics only)
#       → checks: read
permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: read
  checks: read # CHECKS_READ_PERMISSION_ASSERT
  statuses: read # STATUSES_READ_PERMISSION_ASSERT

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: laxcorp-research/openclaw-runtime
  STAGING_APP: https://staging.app.buildclaws.ai
  PROD_APP: https://app.buildclaws.ai

jobs:
  # ─── 0. Deliberate-action + version shape ───────────────────────────────
  gate:
    name: Confirm gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      skip_candidate_check: ${{ inputs.skip_candidate_check }}
    steps:
      - name: Require confirm == PROMOTE-PROD
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "PROMOTE-PROD" ]; then
            echo "::error::confirm must be exactly PROMOTE-PROD (got '${{ inputs.confirm }}'). Refusing to start the promotion window."
            exit 1
          fi

      - name: Validate version format
        id: validate
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]+\.[0-9]+(-[0-9]+)?$'; then
            echo "::error::version '$VERSION' must match YYYY.M.D or YYYY.M.D-N."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ─── 1. PRE-FLIGHT ──────────────────────────────────────────────────────
  preflight:
    name: Pre-flight (GHCR + staging-proven)
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version_digest: ${{ steps.digests.outputs.version_digest }}
      window_state: preflight-done
    steps:
      # PERMISSIONS_PROBE_ASSERT: statusCheckRollup_readable
      # Read-only GraphQL probe BEFORE GHCR/staging gates open any window.
      # Same API as wait-then-merge (`gh pr view --json statusCheckRollup`).
      # Requires workflow-level checks: read + statuses: read (see top comment).
      # Failure here = loud red on dry-run and real runs alike (kills the
      # 29331408200 class before platform create/merge).
      - name: Probe GITHUB_TOKEN can read statusCheckRollup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR=$(gh pr list --state all --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "::error::permissions-probe: no PRs in repo to probe against."
            exit 1
          fi
          echo "Probing statusCheckRollup on PR #$PR…"
          COUNT=$(gh pr view "$PR" --json statusCheckRollup \
            --jq '[.statusCheckRollup[]? | select(.name != null and .name != "")] | length')
          echo "permissions-probe OK: statusCheckRollup readable on PR #$PR (named checks=$COUNT)"

      - name: Resolve GHCR digests for :<version> and :candidate
        id: digests
        env:
          GHCR_READ_USER: ${{ vars.GHCR_READ_USER }}
          GHCR_READ_PAT: ${{ secrets.GHCR_READ_PAT }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_READ_USER:-}" ] || [ -z "${GHCR_READ_PAT:-}" ]; then
            echo "::error::vars.GHCR_READ_USER and secrets.GHCR_READ_PAT must both be configured."
            exit 1
          fi

          TOKEN=$(curl -sS -u "${GHCR_READ_USER}:${GHCR_READ_PAT}" \
            "https://ghcr.io/token?scope=repository:${{ env.IMAGE_NAME }}:pull&service=ghcr.io" \
            | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to mint GHCR pull token."
            exit 1
          fi

          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'

          VERSION_DIGEST=$(curl -sS -D - -o /dev/null \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: $ACCEPT" \
            "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/$VERSION" \
            | tr -d '\r' | awk '/^docker-content-digest:/{print $2}')
          if [ -z "$VERSION_DIGEST" ]; then
            echo "::error:::$VERSION does not exist in GHCR. Cannot promote."
            exit 1
          fi
          echo "Resolved :$VERSION → $VERSION_DIGEST"
          echo "version_digest=$VERSION_DIGEST" >> "$GITHUB_OUTPUT"

          CANDIDATE_DIGEST=$(curl -sS -D - -o /dev/null \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: $ACCEPT" \
            "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/candidate" \
            | tr -d '\r' | awk '/^docker-content-digest:/{print $2}' || echo "")
          echo "Resolved :candidate → ${CANDIDATE_DIGEST:-<missing>}"
          echo "candidate_digest=${CANDIDATE_DIGEST:-}" >> "$GITHUB_OUTPUT"

      - name: Verify :candidate matches :<version>
        if: ${{ !inputs.skip_candidate_check }}
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          VD: ${{ steps.digests.outputs.version_digest }}
          CD: ${{ steps.digests.outputs.candidate_digest }}
        run: |
          set -euo pipefail
          if [ -z "${CD:-}" ]; then
            echo "::error:::candidate missing. Re-run build-openclaw-image.yml or set skip_candidate_check=true."
            exit 1
          fi
          if [ "$VD" != "$CD" ]; then
            echo "::error::Digest mismatch: :candidate=$CD vs :$VERSION=$VD."
            exit 1
          fi
          echo "Candidate digest matches :$VERSION ($VD)."

      # Staging-proven gate: public GET /api/versions/stable on staging (already
      # exists; no new secret). Promote-to-prod requires the version to already
      # be isStable on staging before we open the prod window.
      - name: Verify staging OpenClawVersion isStable == version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          BODY=$(curl -sS --max-time 30 "${{ env.STAGING_APP }}/api/versions/stable")
          echo "staging /api/versions/stable → $BODY"
          STABLE=$(printf '%s' "$BODY" | jq -r '.data.version // empty')
          if [ -z "$STABLE" ]; then
            echo "::error::Could not read staging stable version (empty/malformed response)."
            exit 1
          fi
          if [ "$STABLE" != "$VERSION" ]; then
            echo "::error::Staging-proven gate failed: staging stable='$STABLE' != requested '$VERSION'. Promote on staging first."
            exit 1
          fi
          echo "Staging-proven: stable=$STABLE"

  # ─── 1b. MIGRATION GUARD (staging vs main) ──────────────────────────────
  # Runs between preflight and platform. Lists prisma/migrations/ drift into the
  # step summary always. Nonempty drift requires inputs.migrations_ack ==
  # ACK-MIGRATIONS (maiden window may land this guard; second dispatch onward
  # enforces it when migrations ride the promote).
  migration_guard:
    name: Migration guard (prisma/migrations)
    needs: [gate, preflight]
    runs-on: ubuntu-latest
    outputs:
      window_state: migration-guard-done
    steps:
      - name: Checkout (fetch main + staging for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard prisma/migrations drift (main..staging)
        id: migrations
        env:
          MIGRATIONS_ACK: ${{ inputs.migrations_ack }}
        run: |
          set -euo pipefail
          # MIGRATION_GUARD_ASSERT: prisma_migrations_ack
          git fetch origin main staging --depth=1 2>/dev/null || git fetch origin main staging
          LIST=$(git diff --name-only origin/main..origin/staging -- prisma/migrations/ || true)
          if [ -z "${LIST}" ]; then
            echo "Migration diff (origin/main..origin/staging -- prisma/migrations/): none"
            {
              echo "### Migration guard"
              echo ""
              echo "prisma/migrations/ diff vs main: **none**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Migration directories riding this promote:"
          printf '%s\n' "$LIST"
          {
            echo "### Migration guard"
            echo ""
            echo "prisma/migrations/ directories vs main:"
            echo '```'
            printf '%s\n' "$LIST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${MIGRATIONS_ACK}" != "ACK-MIGRATIONS" ]; then
            echo "::error::prisma/migrations/ differs between origin/main and origin/staging (see list above). Re-dispatch with migrations_ack=ACK-MIGRATIONS to acknowledge, or remove the passenger migrations from staging first."
            exit 1
          fi
          echo "migrations_ack=ACK-MIGRATIONS accepted; proceeding with migrations aboard."

  # ─── 2. PLATFORM (real Production BUILD — never artifact promote) ───────
  # Checkout audit: gate/preflight/probes/summary use curl/API only (no git).
  # migration_guard already checkouts. platform runs git rev-list + gh pr *
  # against the repo — MUST checkout first (run 29301681427 failed without it).
  platform:
    name: Platform promote (staging→main BUILD)
    needs: [gate, preflight, migration_guard]
    runs-on: ubuntu-latest
    outputs:
      merge_sha: ${{ steps.finalize.outputs.merge_sha }}
      pr_url: ${{ steps.finalize.outputs.pr_url }}
      platform_mode: ${{ steps.resolve.outputs.platform_mode }}
      window_state: ${{ steps.state.outputs.window_state }}
    steps:
      - name: Checkout (fetch-depth 0 for main..staging history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve platform mode (noop / promote / dry-run)
        id: resolve
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main staging
          COUNT=$(git rev-list --count origin/main..origin/staging)
          MAIN_SHA=$(git rev-parse origin/main)
          echo "origin/main..origin/staging commit count=$COUNT (main=$MAIN_SHA)"

          if [ "${DRY_RUN}" = "true" ]; then
            # DRY_RUN_ASSERT: platform_echo
            echo "DRY_RUN=true — echoing platform side effects only."
            if [ "$COUNT" -eq 0 ]; then
              echo "WOULD: skip PR/merge (platform already current; staging==main)"
            else
              echo "WOULD: gh pr create --base main --head staging --title \"Promote staging to main (runtime $VERSION)\""
              echo "WOULD: wait for PR check-runs green (≤40m), then gh pr merge <PR> --merge (no --admin)"
              echo "WOULD: poll Vercel Production READY for the merge commit"
            fi
            {
              echo "### Platform (dry-run)"
              echo ""
              echo "ahead_count=$COUNT — **no side effects**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "platform_mode=dry_run" >> "$GITHUB_OUTPUT"
            echo "merge_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$COUNT" -eq 0 ]; then
            # PLATFORM_NOOP_ASSERT: staging_eq_main
            echo "platform already current (staging==main)"
            {
              echo "### Platform"
              echo ""
              echo "platform already current (staging==main) — skipping PR/merge; image+probes continue."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "platform_mode=noop" >> "$GITHUB_OUTPUT"
            echo "merge_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "platform_mode=promote" >> "$GITHUB_OUTPUT"
          echo "ahead_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "merge_sha=" >> "$GITHUB_OUTPUT"
          echo "pr_url=" >> "$GITHUB_OUTPUT"

      - name: Create or reuse staging→main PR
        id: pr
        if: ${{ steps.resolve.outputs.platform_mode == 'promote' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          # Match #265 pattern: PR staging → main, then merge.
          EXISTING=$(gh pr list --base main --head staging --state open --json number,url --jq '.[0] // empty')
          if [ -n "$EXISTING" ]; then
            PR_NUMBER=$(printf '%s' "$EXISTING" | jq -r .number)
            PR_URL=$(printf '%s' "$EXISTING" | jq -r .url)
            echo "Reusing open PR #$PR_NUMBER"
          else
            PR_URL=$(gh pr create --base main --head staging \
              --title "Promote staging to main (runtime $VERSION)" \
              --body "$(printf '%s\n' \
                "## Summary" \
                "- Automated platform promote via promote-to-production.yml" \
                "- Runtime version gate: \`$VERSION\` (staging-proven)" \
                "" \
                "## Note" \
                "This is a real Production BUILD from the merge commit — not an artifact promote." \
              )")
            PR_NUMBER=$(basename "$PR_URL")
            echo "Created PR #$PR_NUMBER"
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for checks, then merge (no --admin)
        id: merge
        if: ${{ steps.resolve.outputs.platform_mode == 'promote' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          # WAIT_THEN_MERGE_ASSERT: poll_checks_before_merge
          # Bounded wait for PR check-runs. Fail loud on timeout or any failed check.
          # Merge WITHOUT --admin so GITHUB_TOKEN only succeeds when protection is
          # actually satisfied (linear history must allow merge commits; reviews/
          # remaining gates → PROMOTE_GITHUB_TOKEN remedy below).
          #
          # Poll implementation → scopes (must match workflow-level permissions):
          #   gh pr view --json statusCheckRollup  → checks:read + statuses:read
          #   gh pr checks (diagnostics on fail/timeout) → checks:read
          DEADLINE_SECS=2400
          START=$SECONDS
          echo "Waiting up to ${DEADLINE_SECS}s for PR #$PR_NUMBER check-runs to go green…"
          while true; do
            ELAPSED=$((SECONDS - START))
            if [ "$ELAPSED" -ge "$DEADLINE_SECS" ]; then
              echo "::error::Timed out after ${DEADLINE_SECS}s waiting for PR #$PR_NUMBER checks to go green."
              gh pr checks "$PR_NUMBER" || true
              exit 1
            fi

            # GraphQL statusCheckRollup: name/status/conclusion (ignore nameless rows)
            ROLLUP=$(gh pr view "$PR_NUMBER" --json statusCheckRollup \
              --jq '[.statusCheckRollup[]? | select(.name != null and .name != "")]')
            TOTAL=$(printf '%s' "$ROLLUP" | jq 'length')
            PENDING=$(printf '%s' "$ROLLUP" | jq '[.[] | select(.status != "COMPLETED")] | length')
            FAILED=$(printf '%s' "$ROLLUP" | jq -r '[.[] | select(.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT" or .conclusion == "ACTION_REQUIRED" or .conclusion == "STARTUP_FAILURE")] | .[].name' | sort -u)

            if [ -n "$FAILED" ]; then
              echo "::error::PR #$PR_NUMBER has failed check(s): $(printf '%s' "$FAILED" | paste -sd ', ' -)"
              gh pr checks "$PR_NUMBER" || true
              exit 1
            fi

            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then
              echo "All $TOTAL named check-runs COMPLETED with no failures (elapsed ${ELAPSED}s)."
              break
            fi

            echo "checks: total=$TOTAL pending=$PENDING elapsed=${ELAPSED}s — sleeping 20s"
            sleep 20
          done

          # MERGE_WITHOUT_ADMIN_ASSERT: no --admin on the merge invocation
          set +e
          MERGE_OUT=$(gh pr merge "$PR_NUMBER" --merge 2>&1)
          MERGE_EC=$?
          set -e
          if [ "$MERGE_EC" -ne 0 ]; then
            echo "$MERGE_OUT"
            echo "::error::GITHUB_TOKEN could not merge PR #$PR_NUMBER after checks were green (branch protection / permissions / merge method). Create repo secret PROMOTE_GITHUB_TOKEN (PAT that can bypass required checks / merge to main), then re-run. Do not mint the PAT until this failure is observed."
            exit 1
          fi
          MERGE_SHA=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq .mergeCommit.oid)
          if [ -z "$MERGE_SHA" ] || [ "$MERGE_SHA" = "null" ]; then
            echo "::error::PR #$PR_NUMBER merged but mergeCommit sha missing."
            exit 1
          fi
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
          echo "Merged → $MERGE_SHA"

      - name: Wait for Vercel Production READY
        id: vercel
        if: ${{ steps.resolve.outputs.platform_mode == 'promote' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::secrets.VERCEL_TOKEN and secrets.VERCEL_PROJECT_ID are required to poll Production READY."
            exit 1
          fi

          # Tolerate missing VERCEL_TEAM_ID: try with team scope when set, else
          # without; if a scoped list returns empty/error, retry without team.
          list_deployments() {
            local team_qs="${1:-}"
            curl -sS --max-time 30 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=20${team_qs}"
          }

          find_match() {
            local resp="$1"
            local short="${MERGE_SHA:0:7}"
            printf '%s' "$resp" | jq -c --arg sha "$MERGE_SHA" --arg short "$short" '
              (.deployments // [])
              | map(select(
                  ((.meta.githubCommitSha // "") == $sha)
                  or ((.meta.githubCommitSha // "") == $short)
                  or ((.meta.gitCommitSha // "") == $sha)
                ))
              | .[0] // empty
            '
          }

          # Poll up to ~12 minutes. Lookup by git commit sha among Production deploys.
          DEADLINE=$((SECONDS + 720))
          while [ $SECONDS -lt $DEADLINE ]; do
            MATCH=""
            if [ -n "${VERCEL_TEAM_ID:-}" ]; then
              RESP=$(list_deployments "&teamId=${VERCEL_TEAM_ID}" || true)
              MATCH=$(find_match "$RESP")
              if [ -z "$MATCH" ]; then
                echo "No match with teamId — retrying listing without team scope…"
                RESP=$(list_deployments "")
                MATCH=$(find_match "$RESP")
              fi
            else
              echo "VERCEL_TEAM_ID unset — listing without team scope (create the secret for Laxcorp Research team)."
              RESP=$(list_deployments "")
              MATCH=$(find_match "$RESP")
            fi

            if [ -n "$MATCH" ]; then
              DEPLOY_STATE=$(printf '%s' "$MATCH" | jq -r '.readyState // .state // empty')
              DEPLOY_URL=$(printf '%s' "$MATCH" | jq -r '.url // empty')
              UID=$(printf '%s' "$MATCH" | jq -r '.uid // empty')
              echo "Found deploy uid=$UID readyState=$DEPLOY_STATE url=$DEPLOY_URL"
              if [ "$DEPLOY_STATE" = "READY" ]; then
                echo "deploy_url=https://$DEPLOY_URL" >> "$GITHUB_OUTPUT"
                echo "deploy_uid=$UID" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$DEPLOY_STATE" = "ERROR" ] || [ "$DEPLOY_STATE" = "CANCELED" ]; then
                echo "::error::Vercel Production deploy $UID ended in $DEPLOY_STATE."
                exit 1
              fi
            else
              echo "No Production deploy for $MERGE_SHA yet…"
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for Vercel Production READY for $MERGE_SHA."
          exit 1

      - name: Finalize platform outputs
        id: finalize
        run: |
          set -euo pipefail
          MODE="${{ steps.resolve.outputs.platform_mode }}"
          if [ "$MODE" = "promote" ]; then
            echo "merge_sha=${{ steps.merge.outputs.merge_sha }}" >> "$GITHUB_OUTPUT"
            echo "pr_url=${{ steps.pr.outputs.pr_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "merge_sha=${{ steps.resolve.outputs.merge_sha }}" >> "$GITHUB_OUTPUT"
            echo "pr_url=${{ steps.resolve.outputs.pr_url }}" >> "$GITHUB_OUTPUT"
          fi
          echo "platform_mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Record window state
        id: state
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "window_state=platform-done" >> "$GITHUB_OUTPUT"
          else
            echo "window_state=platform-failed" >> "$GITHUB_OUTPUT"
          fi

  # ─── 3. IMAGE + REGISTER (reuse promote-openclaw-image.yml) ─────────────
  # GitHub rule: reusable-workflow permissions can only be downgraded by the
  # caller, never elevated. The callee (promote-openclaw-image.yml) declares
  # packages: write — this job MUST grant it. Elevating beyond the caller's
  # grant is a BOOT-TIME startup_failure with zero logs (not a step failure).
  # Checkout audit: callee uses docker/curl only — no git checkout required.
  image:
    name: Image promote + prod register
    if: ${{ inputs.dry_run != true }}
    needs: [gate, platform]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/promote-openclaw-image.yml
    with:
      version: ${{ needs.gate.outputs.version }}
      target_env: production
      # Typed boolean on both sides; == true keeps a real boolean for workflow_call
      # (string "false"/"" would be a compile-time type error on the callee).
      skip_candidate_check: ${{ inputs.skip_candidate_check == true }}
    secrets: inherit

  image_dry_run:
    name: Image promote + prod register (dry-run)
    if: ${{ inputs.dry_run == true }}
    needs: [gate, preflight, platform]
    runs-on: ubuntu-latest
    steps:
      - name: DRY_RUN echo retag + register (no side effects)
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          VERSION_DIGEST: ${{ needs.preflight.outputs.version_digest }}
        run: |
          set -euo pipefail
          # DRY_RUN_ASSERT: image_echo
          UPSTREAM_VERSION="${VERSION%%-*}"
          UPSTREAM_TAG="v${UPSTREAM_VERSION}"
          DOCKER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          REGISTER_URL="https://app.buildclaws.ai/api/internal/versions/register"
          echo "WOULD retag command:"
          echo "  docker buildx imagetools create --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg dockerImage "$DOCKER_IMAGE" \
            --arg imageDigest "$VERSION_DIGEST" \
            --arg buildSourceTag "$UPSTREAM_TAG" \
            --arg buildPushedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg releaseNotesUrl "https://github.com/openclaw/openclaw/releases/tag/$UPSTREAM_TAG" \
            '{version: $version, dockerImage: $dockerImage, imageDigest: $imageDigest, buildSourceTag: $buildSourceTag, buildPushedAt: $buildPushedAt, releaseNotesUrl: $releaseNotesUrl, isStable: true, isCandidate: false}')
          echo "WOULD register POST $REGISTER_URL payload:"
          echo "$PAYLOAD" | jq -c .
          {
            echo "### Image (dry-run)"
            echo ""
            echo "Retag + register **echoed only** — no GHCR/:latest move, no prod isStable write."
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── 4. PROBES (six) ────────────────────────────────────────────────────
  # Each probe is independent (continue-on-error) so a mid-list failure still
  # runs the rest and the aggregate step emits a complete table. Overall job
  # (and thus workflow) red/green is decided solely by the aggregate step.
  probes:
    name: Post-promote probes
    needs: [gate, preflight, platform, image, image_dry_run]
    if: |
      always() &&
      needs.gate.result == 'success' &&
      needs.preflight.result == 'success' &&
      needs.platform.result == 'success' &&
      (needs.image.result == 'success' || needs.image_dry_run.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      window_state: probes-done
      probe_table: ${{ steps.aggregate.outputs.probe_table }}
      probes_ok: ${{ steps.aggregate.outputs.probes_ok }}
    steps:
      - name: Probe 1 — GET /api/health → 200
        id: probe1
        continue-on-error: true
        # PROBE_ASSERT: health_http_200
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 30 "${{ env.PROD_APP }}/api/health")
          echo "HTTP $CODE body=$(cat /tmp/health.json)"
          test "$CODE" = "200"

      - name: Probe 2 — POST /blob-token unauth → 401
        id: probe2
        continue-on-error: true
        # PROBE_ASSERT: blob_token_http_401
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY_RUN_ASSERT: probe_echo blob_token"
            echo "WOULD: POST /api/internal/state/blob-token unauth → expect 401"
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/bt.txt -w "%{http_code}" --max-time 30 \
            -X POST "${{ env.PROD_APP }}/api/internal/state/blob-token" \
            -H "Content-Type: application/json" -d "{}")
          echo "HTTP $CODE body=$(cat /tmp/bt.txt)"
          test "$CODE" = "401"

      - name: Probe 3 — POST /finalize unauth → 401
        id: probe3
        continue-on-error: true
        # PROBE_ASSERT: finalize_http_401
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY_RUN_ASSERT: probe_echo finalize"
            echo "WOULD: POST /api/internal/state/finalize unauth → expect 401"
            exit 0
          fi
          CODE=$(curl -sS -o /tmp/fin.txt -w "%{http_code}" --max-time 30 \
            -X POST "${{ env.PROD_APP }}/api/internal/state/finalize" \
            -H "Content-Type: application/json" -d "{}")
          echo "HTTP $CODE body=$(cat /tmp/fin.txt)"
          test "$CODE" = "401"

      - name: Probe 4 — POST /upload + metering → 413 USE_BLOB
        id: probe4
        continue-on-error: true
        # PROBE_ASSERT: upload_http_413_USE_BLOB
        # Secret name (operator-confirmed): secrets.PROD_METERING_MASTER_SECRET
        # — mirrors prod app env METERING_MASTER_SECRET; do not invent aliases.
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PROD_METERING_MASTER_SECRET: ${{ secrets.PROD_METERING_MASTER_SECRET }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY_RUN_ASSERT: probe_echo upload"
            echo "WOULD: POST /api/internal/state/upload + metering → expect 413 USE_BLOB"
            exit 0
          fi
          if [ -z "${PROD_METERING_MASTER_SECRET:-}" ]; then
            echo "::error::secrets.PROD_METERING_MASTER_SECRET missing (prod METERING_MASTER_SECRET)."
            exit 1
          fi
          BODY='{"workspaceId":"probe","snapshotGzipBase64":"H4sIAAAAAAAAAytJLS7hAgADyz+XBQAAAA=="}'
          CODE=$(curl -sS -o /tmp/up.json -w "%{http_code}" --max-time 30 \
            -X POST "${{ env.PROD_APP }}/api/internal/state/upload" \
            -H "Content-Type: application/json" \
            -H "X-Metering-Secret: $PROD_METERING_MASTER_SECRET" \
            -d "$BODY")
          echo "HTTP $CODE body=$(cat /tmp/up.json)"
          test "$CODE" = "413"
          jq -e '.code == "USE_BLOB"' /tmp/up.json >/dev/null

      - name: Probe 5 — prod stable version via public API
        id: probe5
        continue-on-error: true
        # PROBE_ASSERT: stable_version_match
        # Design: use existing public GET /api/versions/stable (no DATABASE_URL in
        # Actions — avoids shipping prod DB creds to CI). Asserts version string.
        # dry_run: still GET (read-only) but do not fail on mismatch (image not promoted).
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          BODY=$(curl -sS --max-time 30 "${{ env.PROD_APP }}/api/versions/stable")
          echo "prod /api/versions/stable → $BODY"
          STABLE=$(printf '%s' "$BODY" | jq -r '.data.version // empty')
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY_RUN_ASSERT: probe_stable_get"
            echo "WOULD assert STABLE==$VERSION (observed=$STABLE)"
            exit 0
          fi
          test "$STABLE" = "$VERSION"

      - name: Probe 6 — :latest references :<version> digest
        id: probe6
        continue-on-error: true
        # PROBE_ASSERT: latest_references_version_digest
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GHCR_READ_USER: ${{ vars.GHCR_READ_USER }}
          GHCR_READ_PAT: ${{ secrets.GHCR_READ_PAT }}
          VERSION: ${{ needs.gate.outputs.version }}
          EXPECTED: ${{ needs.preflight.outputs.version_digest }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY_RUN_ASSERT: probe_echo latest_digest"
            echo "WOULD: assert :latest equals/references $EXPECTED for :$VERSION"
            exit 0
          fi
          TOKEN=$(curl -sS -u "${GHCR_READ_USER}:${GHCR_READ_PAT}" \
            "https://ghcr.io/token?scope=repository:${{ env.IMAGE_NAME }}:pull&service=ghcr.io" \
            | jq -r .token)
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'

          # Top-level digest of :latest (may be an imagetools-wrapped index).
          LATEST_DIGEST=$(curl -sS -D - -o /dev/null \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: $ACCEPT" \
            "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/latest" \
            | tr -d '\r' | awk '/^docker-content-digest:/{print $2}')

          if [ "$LATEST_DIGEST" = "$EXPECTED" ]; then
            echo ":latest digest == :$VERSION ($LATEST_DIGEST)"
            exit 0
          fi

          LATEST_BODY=$(curl -sS \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: $ACCEPT" \
            "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/latest")
          MEDIA_TYPE=$(printf '%s' "$LATEST_BODY" | jq -r '.mediaType // ""')
          REFERENCED=$(printf '%s' "$LATEST_BODY" \
            | jq -r --arg d "$EXPECTED" '((.manifests // []) | map(.digest) | index($d)) != null')

          case "$MEDIA_TYPE" in
            *image.index*|*manifest.list*)
              if [ "$REFERENCED" = "true" ]; then
                echo ":latest ($LATEST_DIGEST) references :$VERSION ($EXPECTED)"
                exit 0
              fi
              ;;
          esac

          echo "::error:::latest=$LATEST_DIGEST neither equals nor references $EXPECTED"
          exit 1

      - name: Aggregate probe verdict (complete table; fail job if any red)
        id: aggregate
        if: always()
        env:
          P1: ${{ steps.probe1.outcome }}
          P2: ${{ steps.probe2.outcome }}
          P3: ${{ steps.probe3.outcome }}
          P4: ${{ steps.probe4.outcome }}
          P5: ${{ steps.probe5.outcome }}
          P6: ${{ steps.probe6.outcome }}
        run: |
          set -euo pipefail
          # PROBE_AGGREGATE_ASSERT: independent_probes_complete_table
          TABLE=$(printf '%s\n' \
            "| # | Probe | Outcome |" \
            "|---|---|---|" \
            "| 1 | GET /api/health | ${P1} |" \
            "| 2 | POST /blob-token (unauth) | ${P2} |" \
            "| 3 | POST /finalize (unauth) | ${P3} |" \
            "| 4 | POST /upload + metering | ${P4} |" \
            "| 5 | GET /api/versions/stable | ${P5} |" \
            "| 6 | GHCR :latest digest | ${P6} |")
          {
            echo "### Probe results (independent)"
            echo ""
            printf '%s\n' "$TABLE"
          } >> "$GITHUB_STEP_SUMMARY"
          # Single-line for job output (summary job re-prints).
          echo "probe_table<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$TABLE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          FAIL=0
          for o in "$P1" "$P2" "$P3" "$P4" "$P5" "$P6"; do
            if [ "$o" != "success" ]; then FAIL=1; fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "probes_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::One or more probes failed — see complete table above."
            exit 1
          fi
          echo "probes_ok=true" >> "$GITHUB_OUTPUT"
          echo "All six probes green."

  # ─── 5. SUMMARY (always succeeds at summarizing) ────────────────────────
  # Writes window-state + probe table unconditionally (exit 0). Overall run
  # red/green is carried by the probes aggregate step (and earlier jobs), not
  # by failing this summarizer.
  summary:
    name: Promotion summary
    if: always()
    needs: [gate, preflight, migration_guard, platform, image, image_dry_run, probes]
    runs-on: ubuntu-latest
    steps:
      - name: Write run summary + window state
        env:
          GATE: ${{ needs.gate.result }}
          PREFLIGHT: ${{ needs.preflight.result }}
          MIGRATION_GUARD: ${{ needs.migration_guard.result }}
          PLATFORM: ${{ needs.platform.result }}
          IMAGE_REAL: ${{ needs.image.result }}
          IMAGE_DRY: ${{ needs.image_dry_run.result }}
          PROBES: ${{ needs.probes.result }}
          PROBE_TABLE: ${{ needs.probes.outputs.probe_table }}
          VERSION: ${{ needs.gate.outputs.version }}
          MERGE_SHA: ${{ needs.platform.outputs.merge_sha }}
          PR_URL: ${{ needs.platform.outputs.pr_url }}
          PLATFORM_MODE: ${{ needs.platform.outputs.platform_mode }}
          VERSION_DIGEST: ${{ needs.preflight.outputs.version_digest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "$IMAGE_REAL" = "failure" ] || [ "$IMAGE_DRY" = "failure" ]; then
            IMAGE=failure
          elif [ "$IMAGE_REAL" = "success" ] || [ "$IMAGE_DRY" = "success" ]; then
            IMAGE=success
          else
            IMAGE=skipped
          fi

          # Derive recovery-oriented window state from job results.
          if [ "$GATE" != "success" ]; then
            WINDOW="not-started (confirm/version gate failed)"
          elif [ "$PREFLIGHT" != "success" ]; then
            WINDOW="preflight-failed (no platform/image changes)"
          elif [ "$MIGRATION_GUARD" != "success" ]; then
            WINDOW="migration-guard-failed (ack missing or check errored — no platform/image changes)"
          elif [ "$PLATFORM" != "success" ]; then
            WINDOW="platform-failed (image not started — main may be partially merged; inspect PR)"
          elif [ "$IMAGE" != "success" ]; then
            WINDOW="platform-done / image-pending-or-failed — PROD may be Blob-only on old stable image; do NOT deploy containers; re-run image promote for $VERSION"
          elif [ "$PROBES" != "success" ]; then
            WINDOW="platform-done / image-done / probes-failed — inspect which probe; runtime may already be $VERSION"
          elif [ "${DRY_RUN}" = "true" ]; then
            WINDOW="complete — dry_run rehearsal green (no prod side effects)"
          else
            WINDOW="closed-successful — platform+image+probes green"
          fi

          {
            echo "### Promote to Production"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **version** | \`$VERSION\` |"
            echo "| **version digest** | \`$VERSION_DIGEST\` |"
            echo "| **merge sha** | \`$MERGE_SHA\` |"
            echo "| **PR** | $PR_URL |"
            echo "| **platform_mode** | \`$PLATFORM_MODE\` |"
            echo "| **dry_run** | \`$DRY_RUN\` |"
            echo "| **window state** | $WINDOW |"
            echo ""
            echo "### Job results"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| gate | $GATE |"
            echo "| preflight | $PREFLIGHT |"
            echo "| migration_guard | $MIGRATION_GUARD |"
            echo "| platform | $PLATFORM |"
            echo "| image | $IMAGE_REAL |"
            echo "| image_dry_run | $IMAGE_DRY |"
            echo "| probes | $PROBES |"
            echo ""
            echo "### Probe table"
            if [ -n "${PROBE_TABLE:-}" ]; then
              printf '%s\n' "$PROBE_TABLE"
            else
              echo "| # | Probe | Expect |"
              echo "|---|---|---|"
              echo "| 1 | GET /api/health | 200 |"
              echo "| 2 | POST /blob-token (unauth) | 401 |"
              echo "| 3 | POST /finalize (unauth) | 401 |"
              echo "| 4 | POST /upload + metering | 413 USE_BLOB |"
              echo "| 5 | GET /api/versions/stable | version == input |"
              echo "| 6 | GHCR :latest | equals/references version digest |"
              echo ""
              echo "(probe outcomes unavailable — probes job did not emit table)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "WINDOW_STATE=$WINDOW"
          # SUMMARY_ALWAYS_SUCCEEDS: do not exit 1 here — aggregate/probes carry red.