name: Promote OpenClaw Runtime Image to :latest

# PR-1: manual gate for moving production from one OpenClaw runtime version
# to another. The auto-build workflow (build-openclaw-image.yml) only writes
# :candidate; this workflow is the only path that rewrites :latest, the tag
# the production deployer pulls.
#
# Safety checks before re-tagging:
#   1. The :<version> immutable tag must exist in GHCR.
#   2. The :candidate moving pointer must currently resolve to the SAME
#      digest as :<version>. This proves no concurrent auto-build slipped
#      a different candidate in between QA and promotion — if someone
#      ran build-openclaw-image.yml between the QA review and this click,
#      we want the promotion to fail loudly rather than silently promote
#      an unreviewed image.
#   3. Re-tag uses `docker buildx imagetools create` which is a server-side
#      manifest copy — atomic, no re-upload, preserves digest.
#   4. POST to /api/internal/versions/register with isStable=true so the DB
#      record matches what's now at :latest.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to promote (e.g., 2026.5.20 or 2026.5.20-1). Must already exist as :<version> in GHCR.'
        required: true
        type: string
      target_env:
        description: 'Which control plane to register the stable OpenClawVersion row in. REQUIRED, no default — you must consciously pick the env every dispatch (the old silent prod default flipped prod''s deploy target on a staging-intended run). Note: GHCR :latest is moved globally regardless; this only selects which DB the isStable row is written to and cleared in.'
        required: true
        type: choice
        options:
          - staging
          - production
      skip_candidate_check:
        description: 'Emergency override: promote without verifying :candidate digest matches :<version> digest. Only use if a hotfix needs to jump candidates.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: laxcorp-research/openclaw-runtime

jobs:
  promote:
    name: Promote :<version> → :latest
    runs-on: ubuntu-latest
    steps:
      - name: Validate input version format
        id: validate
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          # Same shape check as the build workflow's detect step.
          if ! echo "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]+\.[0-9]+(-[0-9]+)?$'; then
            echo "::error::version '$VERSION' must match YYYY.M.D or YYYY.M.D-N (stable correction). Beta/alpha versions cannot be promoted."
            exit 1
          fi
          # PR-4c: $VERSION can be suffixed (e.g. "2026.5.22-1") to promote a
          # container/-only rebuild without overwriting the canonical
          # :<upstream-version> tag. Export OUR output and UPSTREAM identifiers
          # as distinct names so every reference site picks the right one.
          # `%%-*` is the longest-match strip — robust to any future suffix
          # shape (the shape regex above currently only allows -[0-9]+).
          #
          # Strip cases (verified locally — see tmp/pr4c-strip-sim.sh):
          #   "2026.5.22"     -> upstream_version="2026.5.22"   (no-op)
          #   "2026.5.22-1"   -> upstream_version="2026.5.22"
          #   "2026.5.22-12"  -> upstream_version="2026.5.22"
          UPSTREAM_VERSION="${VERSION%%-*}"

          echo "output_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=v$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          # Backward-compat aliases (deprecated; remove after one release cycle).
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_tag=v$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve GHCR digests for :<version> and :candidate
        id: digests
        env:
          GHCR_READ_USER: ${{ vars.GHCR_READ_USER }}
          GHCR_READ_PAT:  ${{ secrets.GHCR_READ_PAT }}
        run: |
          set -euo pipefail
          # PR-4c: GHCR lookups use OUR output tag (suffixed when -N).
          VERSION="${{ steps.validate.outputs.output_version }}"

          if [ -z "${GHCR_READ_USER:-}" ] || [ -z "${GHCR_READ_PAT:-}" ]; then
            echo "::error::vars.GHCR_READ_USER and secrets.GHCR_READ_PAT must both be configured."
            exit 1
          fi

          TOKEN=$(curl -sS -u "${GHCR_READ_USER}:${GHCR_READ_PAT}" \
            "https://ghcr.io/token?scope=repository:${{ env.IMAGE_NAME }}:pull&service=ghcr.io" \
            | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to mint GHCR pull token. Verify GHCR_READ_PAT has 'read:packages' scope."
            exit 1
          fi

          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'

          # Resolve :<version> digest. Must exist or we cannot promote.
          VERSION_DIGEST=$(curl -sS -D - -o /dev/null \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: $ACCEPT" \
            "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/$VERSION" \
            | tr -d '\r' | awk '/^docker-content-digest:/{print $2}')
          if [ -z "$VERSION_DIGEST" ]; then
            echo "::error:::$VERSION does not exist in GHCR (or HEAD did not return a digest). Cannot promote a version that has not been built."
            exit 1
          fi
          echo "Resolved :$VERSION → $VERSION_DIGEST"
          echo "version_digest=$VERSION_DIGEST" >> "$GITHUB_OUTPUT"

          # Resolve :candidate digest. May not exist on a totally fresh
          # registry, but should exist any time the build workflow has run.
          CANDIDATE_DIGEST=$(curl -sS -D - -o /dev/null \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: $ACCEPT" \
            "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/candidate" \
            | tr -d '\r' | awk '/^docker-content-digest:/{print $2}' || echo "")
          echo "Resolved :candidate → ${CANDIDATE_DIGEST:-<missing>}"
          echo "candidate_digest=${CANDIDATE_DIGEST:-}" >> "$GITHUB_OUTPUT"

      - name: Verify :candidate matches :<version>
        if: inputs.skip_candidate_check != true
        run: |
          set -euo pipefail
          VD="${{ steps.digests.outputs.version_digest }}"
          CD="${{ steps.digests.outputs.candidate_digest }}"

          if [ -z "$CD" ]; then
            echo "::error:::candidate does not exist in GHCR. Re-run build-openclaw-image.yml first, or set skip_candidate_check=true for an emergency override."
            exit 1
          fi

          if [ "$VD" != "$CD" ]; then
            echo "::error::Digest mismatch: :candidate=$CD vs :${{ steps.validate.outputs.output_version }}=$VD. Another build ran between QA and promotion. Re-run QA against the current :candidate, then retry, or set skip_candidate_check=true if this is intentional."
            exit 1
          fi

          echo "Candidate digest matches :${{ steps.validate.outputs.output_version }} ($VD). Safe to promote."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag :<version> → :latest (atomic, server-side)
        run: |
          set -euo pipefail
          # PR-4c: re-tag uses OUR output tag (suffixed when -N).
          VERSION="${{ steps.validate.outputs.output_version }}"
          # imagetools create copies the manifest by digest reference, so this
          # is atomic on the registry side (no re-upload, no race window).
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION"
          echo "Re-tagged :$VERSION → :latest"

      - name: Verify :latest now resolves to the version digest
        env:
          GHCR_READ_USER: ${{ vars.GHCR_READ_USER }}
          GHCR_READ_PAT:  ${{ secrets.GHCR_READ_PAT }}
        run: |
          set -euo pipefail
          # ─── Why this is NOT a strict digest equality (incident #128) ──────
          # `docker buildx imagetools create -t :latest :<version>` does NOT
          # always preserve the digest. When :<version> is a BARE single
          # manifest (`manifest.v2`) — which is what the build workflow
          # produces, since it sets provenance:false/sbom:false — imagetools
          # WRAPS it into a NEW manifest-list/index with a DIFFERENT digest.
          # So :latest (an index) != :<version> (the wrapped bare manifest),
          # even though :latest correctly resolves to the version's content.
          #
          # The old strict `:latest == :<version>` check therefore failed for
          # every clean single-manifest promotion (it passed for 2026.5.22-1
          # ONLY because that image incidentally carried an attestation entry,
          # making it already an index whose digest imagetools preserved —
          # luck, not correctness; see #128 for the full root cause).
          #
          # Correct invariant: :latest must REFERENCE the promoted version —
          # either it equals the version digest (source was already an index,
          # digest preserved) OR :latest is an index whose `.manifests[].digest`
          # includes the version digest (bare source got wrapped). This also
          # tolerates future multi-arch / attestation shapes. A genuinely wrong
          # promotion (different content) matches NEITHER branch and still fails.
          # DO NOT "simplify" this back to strict equality.
          EXPECTED="${{ steps.digests.outputs.version_digest }}"
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json'

          TOKEN=$(curl -sS -u "${GHCR_READ_USER}:${GHCR_READ_PAT}" \
            "https://ghcr.io/token?scope=repository:${{ env.IMAGE_NAME }}:pull&service=ghcr.io" \
            | jq -r .token)

          # Top-level digest of :latest.
          LATEST_DIGEST=$(curl -sS -D - -o /dev/null \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: $ACCEPT" \
            "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/latest" \
            | tr -d '\r' | awk '/^docker-content-digest:/{print $2}')

          if [ "$LATEST_DIGEST" = "$EXPECTED" ]; then
            echo ":latest digest == :${{ steps.validate.outputs.output_version }} ($LATEST_DIGEST) — version was already an index, digest preserved."
            exit 0
          fi

          # Not equal at top level — :latest may be an index wrapping the
          # version's bare manifest. Fetch the body and check its sub-manifests.
          LATEST_BODY=$(curl -sS \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: $ACCEPT" \
            "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/latest")
          MEDIA_TYPE=$(printf '%s' "$LATEST_BODY" | jq -r '.mediaType // ""')
          # jq: is EXPECTED among the index's referenced manifest digests?
          REFERENCED=$(printf '%s' "$LATEST_BODY" \
            | jq -r --arg d "$EXPECTED" '((.manifests // []) | map(.digest) | index($d)) != null')

          case "$MEDIA_TYPE" in
            *image.index*|*manifest.list*)
              if [ "$REFERENCED" = "true" ]; then
                echo ":latest is an index ($LATEST_DIGEST, $MEDIA_TYPE) that references :${{ steps.validate.outputs.output_version }} ($EXPECTED) — correct (bare manifest was wrapped by imagetools)."
                exit 0
              fi
              ;;
          esac

          echo "::error::Post-promote verification failed: :latest=$LATEST_DIGEST ($MEDIA_TYPE) neither equals nor references the promoted digest $EXPECTED. Aborting before the stable register."
          exit 1

      # Map the REQUIRED target_env enum to its register endpoint, then verify
      # the resolved host before any POST. Each env's URL and its expected host
      # are defined INDEPENDENTLY so this fail-closed guard catches a future edit
      # that typos a URL or points an env at the wrong control plane — mirrors
      # assertEndpointHostMatchesApp in src/lib/openclaw/env-guards.ts. Auth note:
      # the single secrets.VERSION_PIPELINE_SECRET authenticates against BOTH envs
      # (build-openclaw-image.yml already registers candidate rows on staging with
      # it on every Monday auto-build), so the staging target does not 401.
      - name: Resolve + verify register endpoint from target_env
        id: endpoint
        run: |
          set -euo pipefail
          case "${{ inputs.target_env }}" in
            production)
              URL="https://app.buildclaws.ai/api/internal/versions/register"
              EXPECTED_HOST="app.buildclaws.ai"
              ;;
            staging)
              URL="https://staging.app.buildclaws.ai/api/internal/versions/register"
              EXPECTED_HOST="staging.app.buildclaws.ai"
              ;;
            *)
              echo "::error::Unknown target_env '${{ inputs.target_env }}' (expected 'staging' or 'production')."
              exit 1
              ;;
          esac
          RESOLVED_HOST="$(printf '%s' "$URL" | sed -E 's#^https?://([^/]+).*#\1#')"
          if [ "$RESOLVED_HOST" != "$EXPECTED_HOST" ]; then
            echo "::error::Host guard tripped: target_env='${{ inputs.target_env }}' resolved host '$RESOLVED_HOST' != expected '$EXPECTED_HOST'. Aborting BEFORE the register POST — refusing to write the stable row to the wrong control plane."
            exit 1
          fi
          echo "target_env='${{ inputs.target_env }}' -> $URL (host '$RESOLVED_HOST' verified against expected '$EXPECTED_HOST')"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "host=$RESOLVED_HOST" >> "$GITHUB_OUTPUT"

      - name: Register OpenClawVersion (stable)
        env:
          VERSION_PIPELINE_SECRET: ${{ secrets.VERSION_PIPELINE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION_PIPELINE_SECRET:-}" ]; then
            echo "::error::secrets.VERSION_PIPELINE_SECRET is not set; cannot register OpenClawVersion stable row."
            exit 1
          fi

          # PR-4c: explicit dual-version naming (mirrors build workflow).
          # OUTPUT_VERSION → OpenClawVersion.version + dockerImage tag.
          # UPSTREAM_TAG  → buildSourceTag + releaseNotesUrl (audit trail of
          # upstream provenance). Pre-PR-4c promote of force_version=X-1 would
          # have stored "vX-1" + a 404 link here.
          OUTPUT_VERSION="${{ steps.validate.outputs.output_version }}"
          UPSTREAM_TAG="${{ steps.validate.outputs.upstream_tag }}"
          DIGEST="${{ steps.digests.outputs.version_digest }}"
          # The version row's dockerImage MUST be the immutable :<version> ref,
          # not :latest. The deployer reads this row and pulls by tag — using
          # :latest here would re-introduce the moving-pointer problem the
          # candidate/latest split is meant to solve.
          DOCKER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$OUTPUT_VERSION"
          PUSHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          RELEASE_NOTES_URL="https://github.com/openclaw/openclaw/releases/tag/$UPSTREAM_TAG"

          PAYLOAD=$(jq -n \
            --arg version       "$OUTPUT_VERSION" \
            --arg dockerImage   "$DOCKER_IMAGE" \
            --arg imageDigest   "$DIGEST" \
            --arg buildSourceTag "$UPSTREAM_TAG" \
            --arg buildPushedAt "$PUSHED_AT" \
            --arg releaseNotesUrl "$RELEASE_NOTES_URL" \
            '{version: $version, dockerImage: $dockerImage, imageDigest: $imageDigest, buildSourceTag: $buildSourceTag, buildPushedAt: $buildPushedAt, releaseNotesUrl: $releaseNotesUrl, isStable: true, isCandidate: false}')

          echo "Posting promote payload:"
          echo "$PAYLOAD" | jq -c .

          HTTP_RESPONSE=$(curl -sS -f --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Pipeline-Secret: $VERSION_PIPELINE_SECRET" \
            -d "$PAYLOAD" \
            "${{ steps.endpoint.outputs.url }}") || {
              echo "::error::Register POST to ${{ steps.endpoint.outputs.url }} (target_env='${{ inputs.target_env }}') failed. If HTTP 401, that deployment's VERSION_PIPELINE_SECRET does not match secrets.VERSION_PIPELINE_SECRET. NOTE: :latest was ALREADY moved by the retag step — re-run after fixing auth. For a staging stable flip, the admin promote route (POST /api/admin/versions/<id>/promote, session auth) is the supported alternative — see docs/CONTAINER_INFRASTRUCTURE.md."
              exit 1
            }

          echo "Register response:"
          echo "$HTTP_RESPONSE" | jq .

      - name: Summary
        run: |
          set -euo pipefail
          echo "### OpenClaw Runtime Image Promoted to :latest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version (our tag):** \`${{ steps.validate.outputs.output_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Upstream version:** \`${{ steps.validate.outputs.upstream_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Upstream tag:** \`${{ steps.validate.outputs.upstream_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Immutable tag:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.validate.outputs.output_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Promoted to:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest:** \`${{ steps.digests.outputs.version_digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          # Shell-side conditional so the workflow expression doesn't have to
          # do ternary string selection (which GitHub Actions doesn't reliably
          # support in all contexts).
          if [ "${{ inputs.skip_candidate_check }}" = "true" ]; then
            echo "- **Candidate check:** SKIPPED (emergency override — verify out of band)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Candidate check:** verified :candidate digest matches :${{ steps.validate.outputs.output_version }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Target env:** \`${{ inputs.target_env }}\` (host \`${{ steps.endpoint.outputs.host }}\` — verified by the host guard)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **OpenClawVersion row:** registered with isStable=true at ${{ steps.endpoint.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Next workspace deploy will pull this image. Existing running containers are NOT affected — they keep their pinned digest until they redeploy. To force a fleet-wide update, see admin → Versions → Force Update All (PR-1b will implement the actual redeploy)." >> "$GITHUB_STEP_SUMMARY"
