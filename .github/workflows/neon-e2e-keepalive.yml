name: Keep Neon E2E branch warm

# GH #73: the E2E test Neon branch (free tier) auto-pauses after ~7 days of
# inactivity, which made CI's "Apply database schema" step fail with P1001 on
# the first PR after a quiet stretch. This scheduled ping keeps the endpoint
# warm so the cold-start case rarely occurs. The ci.yml wake-retry loop is the
# correctness backstop for when this misses (cron skipped, network hiccup, etc).
#
# NOTE: GitHub auto-disables scheduled workflows after 60 days of REPO
# inactivity. This repo is active so that won't trigger in practice — but if the
# repo ever goes dormant, re-enable this workflow (Actions tab) when work resumes.

on:
  schedule:
    # Every 5 days at 12:00 UTC — comfortably under the ~7-day auto-pause window.
    - cron: '0 12 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install pg
        run: npm install pg

      - name: Ping Neon E2E branch
        run: |
          node -e "
            const { Client } = require('pg');
            const client = new Client({
              connectionString: process.env.DATABASE_URL,
              connectionTimeoutMillis: 30000
            });
            (async () => {
              try {
                await client.connect();
                const r = await client.query('SELECT NOW() as now');
                console.log('✓ Neon E2E branch alive at', r.rows[0].now);
                await client.end();
              } catch (err) {
                console.error('✗ Neon E2E branch ping failed:', err.message);
                process.exit(1);
              }
            })();
          "
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
