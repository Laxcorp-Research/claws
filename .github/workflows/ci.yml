name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

# Public main requires: "Lint, Type Check & Build", "Unit & Integration Tests",
# "E2E Tests", and "Security Audit". E2E uses service containers and no secrets.
# e2e-tests concurrency has cancel-in-progress: false so a newer PR cannot kill this gate.

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # PR-2d: hard-fail any prisma/migrations/**/*.sql whose first 3 bytes
      # are EF BB BF (UTF-8 BOM). PostgreSQL's parser rejects the BOM at
      # position 0 before any DDL runs, causing `prisma migrate deploy` to
      # fail with code 42601 on Vercel — which then strands an advisory
      # lock in pgbouncer. Failure mode bit PR-3 once; this gate makes the
      # next occurrence impossible to land. Runs before setup-node so it's
      # fast-fail and uses zero npm deps (POSIX head/od/find only).
      # See docs/MIGRATIONS.md for the remedy when authoring on Windows.
      - name: Guard against UTF-8 BOM in migration SQL files
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              echo "::error file=$f::SQL migration starts with UTF-8 BOM (EF BB BF). PostgreSQL rejects this on 'prisma migrate deploy'. Re-author without a BOM. PowerShell: use [System.IO.File]::WriteAllBytes + [System.Text.UTF8Encoding]::new(\$false). See docs/MIGRATIONS.md."
              fail=1
            fi
          done < <(find prisma/migrations -type f -name '*.sql' -print0)
          exit "$fail"

      # prisma/migrations/ may only contain migration_lock.toml and timestamped
      # family directories (NNNNNNNNNNNNNN_name/migration.sql). Stray scripts
      # here become promote-guard passengers. Fail closed.
      - name: Guard prisma/migrations layout (families only)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          shopt -s nullglob
          for p in prisma/migrations/*; do
            base=$(basename "$p")
            if [ -f "$p" ]; then
              if [ "$base" != "migration_lock.toml" ]; then
                echo "::error file=$p::non-migration file under prisma/migrations/. Only migration_lock.toml and timestamped family directories are allowed. Move scripts to scripts/archive/."
                fail=1
              fi
            elif [ -d "$p" ]; then
              if ! printf '%s' "$base" | grep -Eq '^[0-9]{14}_[a-z0-9_]+$'; then
                echo "::error file=$p::prisma/migrations/ directory is not a timestamped family (expected NNNNNNNNNNNNNN_name)."
                fail=1
              fi
              if [ ! -f "$p/migration.sql" ]; then
                echo "::error file=$p::timestamped family is missing migration.sql."
                fail=1
              fi
            fi
          done
          exit "$fail"

      # PR-4c: hard-fail any GHCR-touching workflow that clones the openclaw
      # upstream under a variable that isn't the unsuffixed upstream identifier.
      # PR-2b's immutable-tag policy lets us trigger overlay-only rebuilds via
      # `force_version=2026.5.22-N`; the suffixed value is OUR output tag but
      # upstream only publishes `v2026.5.22`. Pre-PR-4c, a single shared
      # `version` output meant `git clone --branch v$VERSION` looked for the
      # suffixed tag upstream and failed (this exact bug blocked the PR-4
      # plugin rebuild and surfaced PR-4c).
      #
      # Narrow invariant: any line in .github/workflows/*.yml that runs
      # `git clone ...openclaw...` MUST reference one of `upstream_version`
      # or `upstream_tag` (the unsuffixed outputs) — never `output_version`,
      # `version`, or `source_version` alone. Class of bug cannot recur
      # without showing up here.
      #
      # Matcher catches the literal `openclaw/openclaw.git` AND the templated
      # `${{ env.UPSTREAM_REPO }}.git` form (workflows resolve UPSTREAM_REPO
      # to openclaw/openclaw via the env block). Multi-line clones aren't
      # used today; if they ever become a thing we tighten the matcher.
      - name: Guard openclaw upstream-clone references upstream_* outputs
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            # grep -n surfaces line numbers; comment-line skip prevents the
            # guard's own documentation from tripping it.
            while IFS=: read -r lineno content; do
              if ! printf '%s' "$content" | grep -Eq 'upstream_(version|tag)'; then
                echo "::error file=$f,line=$lineno::workflow clones openclaw upstream but does not use \`upstream_version\` / \`upstream_tag\`. Cloning under a suffixed value (e.g. 'v2026.5.22-1') points at a tag upstream does not publish. Use \`steps.<id>.outputs.upstream_tag\` or \`upstream_version\` instead. Found: $content"
                fail=1
              fi
            done < <(grep -nE 'git[[:space:]]+clone[[:space:]].*(openclaw/openclaw\.git|\$\{\{[[:space:]]*env\.UPSTREAM_REPO[[:space:]]*\}\}\.git)' "$f" \
                     | grep -vE '^[0-9]+:[[:space:]]*#' \
                     || true)
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          exit "$fail"

      # D1: lint the staging cron scheduler workflow (scoped — full-tree actionlint
      # currently fails on pre-existing shellcheck style findings in image promote
      # workflows; do not expand until those are cleaned up separately).
      - name: actionlint (staging-cron-scheduler)
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color .github/workflows/staging-cron-scheduler.yml

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prisma schema validation
        run: npx prisma validate

      - name: TypeScript type check
        run: npx tsc --noEmit

      # Real gate since the brace-expansion override fix (lint crashed for
      # months with `expand is not a function`; continue-on-error hid it).
      # Errors BLOCK. Warnings are the tracked burn-down: react-hooks v6
      # staged-adoption rules + no-img-element + exhaustive-deps (see
      # eslint.config.mjs). Restore --max-warnings 0 when the burn-down
      # hits zero.
      - name: ESLint
        run: npx eslint .

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          NEXTAUTH_SECRET: "dummy-secret-for-ci-build"
          NEXTAUTH_URL: "http://localhost:3000"
          ENCRYPTION_MASTER_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          ENCRYPTION_KEY_VERSION: "v1"

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Vitest
        run: npx vitest run --reporter=github-actions
        env:
          ENCRYPTION_MASTER_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          ENCRYPTION_KEY_VERSION: "v1"
          NEXTAUTH_SECRET: "ci-test-secret"
          NEXTAUTH_URL: "http://localhost:3000"

  e2e-tests:
    name: E2E Tests
    # Local Postgres + Redis service containers. No repository secrets, so a
    # pull request from a fork runs the same job as a same-repo pull request.
    # ubuntu-24.04: ubuntu-latest is 26.04 and Playwright has no Chromium build for it.
    runs-on: ubuntu-24.04
    needs: [unit-tests]
    concurrency:
      group: ci-e2e-${{ github.repository }}
      cancel-in-progress: false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: claws
          POSTGRES_PASSWORD: claws
          POSTGRES_DB: claws
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claws -d claws"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis-http:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-redis-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
    env:
      DATABASE_URL: postgresql://claws:claws@localhost:5432/claws
      DIRECT_URL: postgresql://claws:claws@localhost:5432/claws
      UPSTASH_REDIS_REST_URL: http://127.0.0.1:8079
      UPSTASH_REDIS_REST_TOKEN: ci-redis-token
      E2E_TEST_MODE: "true"
      ADMIN_EMAILS: "e2e-admin@buildclaws.ai"
      ENCRYPTION_MASTER_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ENCRYPTION_KEY_VERSION: "v1"
      NEXTAUTH_SECRET: "ci-test-secret-ci-test-secret-ci-test-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Reset schema, apply migrations, and seed
        run: npx prisma migrate reset --force

      - name: Redis answers ping
        run: |
          node -e "const {Redis}=require('@upstash/redis'); const r=new Redis({url:process.env.UPSTASH_REDIS_REST_URL, token:process.env.UPSTASH_REDIS_REST_TOKEN}); r.ping().then((v)=>{console.log('redis', v); if(v!=='PONG') process.exit(1)}).catch((e)=>{console.error(e); process.exit(1)})"

      - name: Install Playwright Chromium
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --retries=2

      - name: Self-host store install walk
        run: npx playwright test --config=playwright.self-host.config.ts --retries=2

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: audit-ci (npm audit with curated allowlist)
        # Replaces bare `npm audit --audit-level=high --omit=dev`. Reads
        # `audit-ci.json` at repo root for the allowlist of GHSAs whose
        # upstream has no patch released. Re-audit deadline: 2026-07-15.
        # See docs/LAUNCH_BLOCKERS.md + GH#72 for the per-GHSA rationale.
        run: npx audit-ci --config audit-ci.json
