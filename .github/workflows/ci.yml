name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # PR-2d: hard-fail any prisma/migrations/**/*.sql whose first 3 bytes
      # are EF BB BF (UTF-8 BOM). PostgreSQL's parser rejects the BOM at
      # position 0 before any DDL runs, causing `prisma migrate deploy` to
      # fail with code 42601 on Vercel — which then strands an advisory
      # lock in pgbouncer. Failure mode bit PR-3 once; this gate makes the
      # next occurrence impossible to land. Runs before setup-node so it's
      # fast-fail and uses zero npm deps (POSIX head/od/find only).
      # See docs/MIGRATIONS.md for the remedy when authoring on Windows.
      - name: Guard against UTF-8 BOM in migration SQL files
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              echo "::error file=$f::SQL migration starts with UTF-8 BOM (EF BB BF). PostgreSQL rejects this on 'prisma migrate deploy'. Re-author without a BOM. PowerShell: use [System.IO.File]::WriteAllBytes + [System.Text.UTF8Encoding]::new(\$false). See docs/MIGRATIONS.md."
              fail=1
            fi
          done < <(find prisma/migrations -type f -name '*.sql' -print0)
          exit "$fail"

      # PR-4c: hard-fail any GHCR-touching workflow that clones the openclaw
      # upstream under a variable that isn't the unsuffixed upstream identifier.
      # PR-2b's immutable-tag policy lets us trigger overlay-only rebuilds via
      # `force_version=2026.5.22-N`; the suffixed value is OUR output tag but
      # upstream only publishes `v2026.5.22`. Pre-PR-4c, a single shared
      # `version` output meant `git clone --branch v$VERSION` looked for the
      # suffixed tag upstream and failed (this exact bug blocked the PR-4
      # plugin rebuild and surfaced PR-4c).
      #
      # Narrow invariant: any line in .github/workflows/*.yml that runs
      # `git clone ...openclaw...` MUST reference one of `upstream_version`
      # or `upstream_tag` (the unsuffixed outputs) — never `output_version`,
      # `version`, or `source_version` alone. Class of bug cannot recur
      # without showing up here.
      #
      # Matcher catches the literal `openclaw/openclaw.git` AND the templated
      # `${{ env.UPSTREAM_REPO }}.git` form (workflows resolve UPSTREAM_REPO
      # to openclaw/openclaw via the env block). Multi-line clones aren't
      # used today; if they ever become a thing we tighten the matcher.
      - name: Guard openclaw upstream-clone references upstream_* outputs
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            # grep -n surfaces line numbers; comment-line skip prevents the
            # guard's own documentation from tripping it.
            while IFS=: read -r lineno content; do
              if ! printf '%s' "$content" | grep -Eq 'upstream_(version|tag)'; then
                echo "::error file=$f,line=$lineno::workflow clones openclaw upstream but does not use \`upstream_version\` / \`upstream_tag\`. Cloning under a suffixed value (e.g. 'v2026.5.22-1') points at a tag upstream does not publish. Use \`steps.<id>.outputs.upstream_tag\` or \`upstream_version\` instead. Found: $content"
                fail=1
              fi
            done < <(grep -nE 'git[[:space:]]+clone[[:space:]].*(openclaw/openclaw\.git|\$\{\{[[:space:]]*env\.UPSTREAM_REPO[[:space:]]*\}\}\.git)' "$f" \
                     | grep -vE '^[0-9]+:[[:space:]]*#' \
                     || true)
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          exit "$fail"

      # D1: lint the staging cron scheduler workflow (scoped — full-tree actionlint
      # currently fails on pre-existing shellcheck style findings in image promote
      # workflows; do not expand until those are cleaned up separately).
      - name: actionlint (staging-cron-scheduler)
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color .github/workflows/staging-cron-scheduler.yml

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prisma schema validation
        run: npx prisma validate

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --max-warnings 0
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          NEXTAUTH_SECRET: "dummy-secret-for-ci-build"
          NEXTAUTH_URL: "http://localhost:3000"
          ENCRYPTION_MASTER_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          ENCRYPTION_KEY_VERSION: "v1"

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Vitest
        run: npx vitest run --reporter=github-actions
        env:
          ENCRYPTION_MASTER_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          ENCRYPTION_KEY_VERSION: "v1"
          NEXTAUTH_SECRET: "ci-test-secret"
          NEXTAUTH_URL: "http://localhost:3000"

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    concurrency:
      group: ci-e2e-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # GH #73 fix: this step MUST run BEFORE "Apply database schema". The E2E
      # Neon branch (free tier) auto-pauses after inactivity; the schema push
      # was hitting a cold/suspended endpoint and throwing P1001 before anything
      # could wake it. Bounded retry loop (10 × 6s = 60s budget; Neon cold-start
      # is 5–15s typical) waits the endpoint up, then FAILS LOUD (exit 1) if the
      # budget is exhausted — a genuinely-unreachable DB should be a hard error,
      # not the old single-shot best-effort exit(0) that masked the problem.
      - name: Wake up Neon database
        run: |
          node -e "
            const { Client } = require('pg');
            const url = process.env.DATABASE_URL;
            const MAX_ATTEMPTS = 10;
            const DELAY_MS = 6000;

            async function attempt(n) {
              const client = new Client({ connectionString: url, connectionTimeoutMillis: 10000 });
              try {
                await client.connect();
                await client.query('SELECT 1');
                await client.end();
                console.log(\`✓ Neon endpoint awake after \${n} attempt(s)\`);
                return true;
              } catch (err) {
                try { await client.end(); } catch {}
                console.log(\`Attempt \${n}/\${MAX_ATTEMPTS}: \${err.code || err.message}\`);
                return false;
              }
            }

            (async () => {
              for (let i = 1; i <= MAX_ATTEMPTS; i++) {
                if (await attempt(i)) process.exit(0);
                if (i < MAX_ATTEMPTS) await new Promise(r => setTimeout(r, DELAY_MS));
              }
              console.error(\`✗ Neon endpoint unreachable after \${MAX_ATTEMPTS} attempts (\${(MAX_ATTEMPTS * DELAY_MS) / 1000}s budget exhausted)\`);
              process.exit(1);
            })();
          "
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Verify E2E reset target (fail-closed)
        run: |
          HOST=$(printf '%s' "$TEST_DIRECT_URL" | sed -E 's#^[^@]+@([^/?]+).*#\1#')
          printf '%s' "$HOST" | grep -q 'ep-broad-smoke-andow2sv' || { echo "FATAL: not the E2E branch"; exit 1; }
          printf '%s' "$HOST" | grep -q 'pooler' && { echo "FATAL: pooled endpoint; reset needs direct"; exit 1; }
          printf '%s' "$HOST" | grep -Eq 'ep-polished-night|ep-delicate-water' && { echo "FATAL: staging/prod target — refusing reset"; exit 1; }
          echo "✓ E2E reset target verified (E2E branch, direct, non-staging/prod)"
        env:
          TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}

      - name: Reset E2E schema from baseline and apply committed migrations
        # Replaces `prisma db push --accept-data-loss` (closes GH #50 for E2E). reset = drop+recreate
        # schema, clear history, replay ALL committed migrations from zero via the same engine prod uses
        # (build:deploy → migrate deploy). DIRECT endpoint: migrate needs DDL + advisory locks the
        # pooler won't serve.
        run: npx prisma migrate reset --force
        env:
          DATABASE_URL: ${{ secrets.TEST_DIRECT_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --retries=2
        env:
          E2E_TEST_MODE: "true"
          ADMIN_EMAILS: "e2e-admin@buildclaws.ai"
          ENCRYPTION_MASTER_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          ENCRYPTION_KEY_VERSION: "v1"
          NEXTAUTH_SECRET: "ci-test-secret-ci-test-secret-ci-test-secret"
          NEXTAUTH_URL: "http://localhost:3000"
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: "https://fake-redis.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "fake-token-for-ci"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: audit-ci (npm audit with curated allowlist)
        # Replaces bare `npm audit --audit-level=high --omit=dev`. Reads
        # `audit-ci.json` at repo root for the allowlist of GHSAs whose
        # upstream has no patch released. Re-audit deadline: 2026-07-15.
        # See docs/LAUNCH_BLOCKERS.md + GH#72 for the per-GHSA rationale.
        run: npx audit-ci --config audit-ci.json
