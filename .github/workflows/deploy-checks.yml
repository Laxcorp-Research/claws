name: Post-Deploy Smoke Tests

on:
  deployment_status:

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check app is live
        run: |
          DEPLOY_URL="${{ github.event.deployment_status.target_url }}"
          echo "Checking $DEPLOY_URL..."
          curl -sSfL --max-time 30 "$DEPLOY_URL/store" > /dev/null || exit 1
          echo "✅ App is responding"

      - name: Check API health
        run: |
          DEPLOY_URL="${{ github.event.deployment_status.target_url }}"
          curl -sSfL --max-time 30 "$DEPLOY_URL/api/health" > /dev/null || echo "⚠️ Health endpoint not responding (non-blocking)"
          curl -sSfL --max-time 30 "$DEPLOY_URL/api/templates" > /dev/null || exit 1
          echo "✅ API is responding"
