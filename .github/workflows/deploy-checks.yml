name: Post-Deploy Smoke Tests

on:
  deployment_status:

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check app is live
        run: |
          DEPLOY_URL="${{ github.event.deployment_status.target_url }}"
          echo "Checking $DEPLOY_URL..."
          HTTP_CODE=$(curl -sSL -o /dev/null -w "%{http_code}" --max-time 30 "$DEPLOY_URL/store" || echo "000")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "401" ]; then
            echo "⚠️ Vercel authentication is blocking access (expected for preview deploys)"
            exit 0
          elif [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "✅ App is responding"
          else
            echo "❌ App returned $HTTP_CODE"
            exit 1
          fi

      - name: Check API health
        run: |
          DEPLOY_URL="${{ github.event.deployment_status.target_url }}"
          HTTP_CODE=$(curl -sSL -o /dev/null -w "%{http_code}" --max-time 30 "$DEPLOY_URL/api/health" || echo "000")
          if [ "$HTTP_CODE" = "401" ]; then
            echo "⚠️ Skipping API checks — Vercel auth enabled"
            exit 0
          fi
          curl -sSfL --max-time 30 "$DEPLOY_URL/api/marketplace/templates" > /dev/null || echo "⚠️ Marketplace templates API not responding"
          echo "✅ API checks complete"
