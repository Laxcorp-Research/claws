name: Build OpenClaw Runtime Image

# PR-1 (2026-05-24): fixed the three defects identified in Phase 0/1 diagnosis:
#   1. Version detection: replaced unpaginated GHCR /tags/list call (which missed
#      newer tags because GHCR returns only the first page by default — upstream
#      has 60+ date-versioned tags but we were seeing 100 alphabetical tags max)
#      with the GitHub Releases API filtered on prerelease==false. This is the
#      only reliable source for "what is the newest STABLE release upstream".
#   2. Skip-check: anonymous GHCR token mint returned 401 against our PRIVATE
#      package, the previous code emitted a warning and proceeded with build,
#      causing weekly unconditional rebuilds. Now uses an authenticated mint
#      via secrets.GHCR_READ_PAT + vars.GHCR_READ_USER and fails the job if
#      the credentials aren't usable.
#   3. Unsafe `|| git clone main` fallback: removed. If the v-prefixed tag clone
#      fails the job fails loudly instead of silently shipping unpinned HEAD.
#
# Tagging policy (PR-1, "candidate" pattern):
#   - :base-<version>  immutable per-version base image (upstream OpenClaw)
#   - :<version>       immutable per-version extended image (with our overlay)
#   - :candidate       MOVING pointer to the newest auto-built extended image
#   - :latest          NOT moved here. Only the manual
#                      promote-openclaw-image.yml workflow rewrites :latest,
#                      so production deploys never advance without a human gate.
#
# After successful push we POST to /api/internal/versions/register with
# isCandidate=true so OpenClawVersion gets a row that matches the actual
# pushed image + digest. See the "Register OpenClawVersion" step.

on:
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force build a specific upstream STABLE version (e.g., 2026.5.20 or 2026.5.20-1). Leave empty for auto-detect of newest stable.'
        required: false
        type: string
      register_endpoint:
        description: 'Register endpoint URL (default: staging). Set to https://app.buildclaws.ai/api/internal/versions/register for prod.'
        required: false
        type: string
        default: 'https://staging.app.buildclaws.ai/api/internal/versions/register'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: laxcorp-research/openclaw-runtime
  UPSTREAM_REPO: openclaw/openclaw
  EXTENSIONS: "telegram discord slack whatsapp msteams signal"
  DEFAULT_REGISTER_ENDPOINT: 'https://staging.app.buildclaws.ai/api/internal/versions/register'

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Claws repo
        uses: actions/checkout@v4

      - name: Detect latest upstream STABLE release
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.force_version }}" ]; then
            VERSION="${{ inputs.force_version }}"
            echo "Using forced version: $VERSION"
          else
            # Releases API is the only reliable source for "newest stable".
            #
            # Why this is NOT `gh api --paginate ... --jq '...'`:
            # `--jq` runs PER PAGE under `--paginate`. The first iteration
            # of this workflow (#84 + #85) used
            # `--jq '[.[] | select(...) | .tag_name] | first'` which
            # returned ONE value per page across 4 pages — 4 lines of
            # output, multi-line `$VERSION`, broken `$GITHUB_OUTPUT` write
            # ("Unable to process file command 'output'"). Fixed by
            # dropping `--jq` and piping the concatenated JSON array to a
            # standalone `jq` that processes the full set in one pass.
            #
            # Sort policy: explicit date-version-tuple sort, not
            # publish-date order. A back-published correction for an
            # older version (e.g. 2026.4.27-1 cut after 2026.5.20)
            # must NOT win over a newer stable.
            #
            # Tag-shape filter: ancient upstream releases (e.g.
            # v2.0.0-beta5) are flagged prerelease=false but predate
            # the YYYY.M.D convention. `test()` filters them out
            # explicitly so a future jq version stricter about null
            # capture cannot break the sort.
            VERSION=$(gh api \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${{ env.UPSTREAM_REPO }}/releases?per_page=50" \
              --paginate \
              | jq -r '
                  map(select(.prerelease == false and .draft == false))
                  | map(.tag_name)
                  | map(select(test("^v?\\d+\\.\\d+\\.\\d+(-\\d+)?$")))
                  | sort_by(
                      capture("^v?(?<y>\\d+)\\.(?<m>\\d+)\\.(?<d>\\d+)(-(?<n>\\d+))?$")
                      | [(.y | tonumber), (.m | tonumber), (.d | tonumber), ((.n // "0") | tonumber)]
                    )
                  | last
                  | sub("^v"; "")
                ')
            echo "Detected upstream stable: $VERSION"
          fi

          # ---- Sanity checks BEFORE we touch $GITHUB_OUTPUT --------------
          # The prior workflow leaked a multi-line value into $GITHUB_OUTPUT
          # because the shape check used `echo "$VERSION" | grep -Eq` which
          # returns 0 if ANY line matches — false-clean on a 4-line value.
          # These three checks each fail loud, separately, with the actual
          # offending value in the log:
          #   1) non-empty
          #   2) exactly one line (no embedded newlines)
          #   3) matches stable shape (YYYY.M.D or YYYY.M.D-N)
          # No heredoc-wrap on the OUTPUT write — by this point VERSION is
          # guaranteed single-line so plain `key=value` is correct.

          if [ -z "$VERSION" ]; then
            echo "::error::Detection returned an empty VERSION. No stable release found in upstream Releases API (or jq filter excluded all candidates)."
            exit 1
          fi

          if [[ "$VERSION" == *$'\n'* ]]; then
            echo "::error::Detection returned a multi-line VERSION (jq should emit one scalar — see step comment for the regression history). Got:"
            printf '%s\n' "$VERSION"
            exit 1
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]+\.[0-9]+(-[0-9]+)?$'; then
            echo "::error::Detected version '$VERSION' does not match stable shape (YYYY.M.D[-N]). Refusing to build."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute overlay source hash (for skip-check overlay-awareness)
        id: overlay
        run: |
          set -euo pipefail
          # PR-2b #7: hash the files that comprise the Claws overlay applied
          # on top of the upstream OpenClaw base image. If these change,
          # the resulting image differs even when upstream version doesn't,
          # so the scheduled Monday skip-check MUST rebuild.
          #
          # Files included: anything that ends up in the image (Dockerfile
          # plus everything under container/ that the Dockerfile COPYs in).
          # The find pattern is intentionally broad — better to over-rebuild
          # than to ship a stale overlay. Sort to make the hash
          # deterministic across filesystems.
          OVERLAY_SHA=$(find docker container -type f \
            \( -name '*.mjs' -o -name '*.json' -o -name '*.md' -o -name 'Dockerfile' \) \
            -print0 2>/dev/null \
            | sort -z \
            | xargs -0 sha256sum 2>/dev/null \
            | sha256sum \
            | cut -d' ' -f1)
          echo "Overlay source SHA: $OVERLAY_SHA"
          # Sanity: non-empty + 64 hex chars
          if ! printf '%s' "$OVERLAY_SHA" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Computed overlay SHA looks invalid: '$OVERLAY_SHA'. Likely missing find/sha256sum output."
            exit 1
          fi
          echo "sha=$OVERLAY_SHA" >> "$GITHUB_OUTPUT"

      - name: Check if image already exists in GHCR (skip if so)
        id: check
        env:
          GHCR_READ_USER: ${{ vars.GHCR_READ_USER }}
          GHCR_READ_PAT:  ${{ secrets.GHCR_READ_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.detect.outputs.version }}"
          OVERLAY_SHA="${{ steps.overlay.outputs.sha }}"
          FORCE_VERSION="${{ inputs.force_version }}"

          if [ -z "${GHCR_READ_USER:-}" ] || [ -z "${GHCR_READ_PAT:-}" ]; then
            echo "::error::vars.GHCR_READ_USER and secrets.GHCR_READ_PAT must both be configured (skip-check cannot use anonymous tokens against a private GHCR package — see PR-1)."
            exit 1
          fi

          # Authenticated GHCR pull token mint. Basic auth with PAT in the
          # password slot; GHCR rejects GITHUB_TOKEN here (Actions-issued
          # tokens cannot mint cross-org package pulls).
          TOKEN=$(curl -sS -u "${GHCR_READ_USER}:${GHCR_READ_PAT}" \
            "https://ghcr.io/token?scope=repository:${{ env.IMAGE_NAME }}:pull&service=ghcr.io" \
            | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to mint GHCR pull token. Verify GHCR_READ_PAT has 'read:packages' scope and matches GHCR_READ_USER."
            exit 1
          fi

          # HEAD the manifest. Accept multiple media types so both OCI single
          # and Docker manifest-list responses count as "exists".
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/$VERSION")

          # PR-2b #6: immutable-tag policy. If the operator passed
          # force_version explicitly and the tag already exists, REQUIRE
          # the version to carry a -N suffix (e.g. 2026.5.22-1) so the
          # canonical :<upstream-version> tag stays immutable. This is the
          # exact footgun we hit on 2026-05-26: overwriting :2026.5.22
          # silently swapped the digest under :latest for anyone who'd
          # already promoted, with no audit signal.
          if [ "$STATUS" = "200" ] && [ -n "$FORCE_VERSION" ]; then
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]+\.[0-9]+-[0-9]+$'; then
              echo "::error::Refusing to overwrite immutable tag ${{ env.IMAGE_NAME }}:$VERSION. Force-rebuilds of an already-published tag require a -N suffix to keep per-version digests immutable. Use force_version=$VERSION-1 (or higher -N) instead."
              exit 1
            fi
            echo "Force-rebuild with suffix-bumped version $VERSION accepted (existing tag will NOT be overwritten — this is a new immutable tag)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PR-2b #7: overlay-aware skip-check. If the upstream :<version>
          # tag exists AND we're on a scheduled build (no force_version),
          # we used to skip unconditionally. That was the blind spot that
          # caused our PR-2 plugin to never ship in the Monday auto-build:
          # upstream version was unchanged, but our overlay (Dockerfile +
          # container/) had a new COPY line. Now: read the
          # ai.buildclaws.overlay-sha label from the existing image's
          # config blob. If it matches the current overlay SHA, skip; if
          # it differs (or is absent — never-tagged images), rebuild.
          if [ "$STATUS" = "200" ] && [ -z "$FORCE_VERSION" ]; then
            # Resolve manifest → config digest → config blob → label.
            # Pass Accept for both v2 and OCI manifest media types; in some
            # cases the manifest is a manifest-list (index) — handle that
            # by drilling to the first platform manifest.
            MANIFEST_JSON=$(curl -sS \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/$VERSION")

            # If it's a manifest list, pick the linux/amd64 entry and re-fetch.
            FIRST_LIST_DIGEST=$(printf '%s' "$MANIFEST_JSON" | jq -r '
              if (.mediaType // "") | test("manifest.list|image.index") then
                (.manifests | map(select(.platform.os=="linux" and .platform.architecture=="amd64")) | .[0].digest // .manifests[0].digest // "")
              else "" end
            ')
            if [ -n "$FIRST_LIST_DIGEST" ] && [ "$FIRST_LIST_DIGEST" != "null" ]; then
              MANIFEST_JSON=$(curl -sS \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
                "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/$FIRST_LIST_DIGEST")
            fi

            CONFIG_DIGEST=$(printf '%s' "$MANIFEST_JSON" | jq -r '.config.digest // ""')
            BAKED_OVERLAY_SHA=""
            if [ -n "$CONFIG_DIGEST" ] && [ "$CONFIG_DIGEST" != "null" ]; then
              CONFIG_BLOB=$(curl -sS \
                -H "Authorization: Bearer $TOKEN" \
                "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/blobs/$CONFIG_DIGEST")
              BAKED_OVERLAY_SHA=$(printf '%s' "$CONFIG_BLOB" | jq -r '.config.Labels["ai.buildclaws.overlay-sha"] // ""')
            fi

            if [ -n "$BAKED_OVERLAY_SHA" ] && [ "$BAKED_OVERLAY_SHA" = "$OVERLAY_SHA" ]; then
              echo "Image ${{ env.IMAGE_NAME }}:$VERSION already exists with overlay-sha=$BAKED_OVERLAY_SHA matching current. Skipping build."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -z "$BAKED_OVERLAY_SHA" ]; then
              echo "Image ${{ env.IMAGE_NAME }}:$VERSION exists but carries NO ai.buildclaws.overlay-sha label (pre-PR-2b build). Treating as overlay-mismatched → rebuilding."
            else
              echo "Image ${{ env.IMAGE_NAME }}:$VERSION overlay-sha=$BAKED_OVERLAY_SHA != current=$OVERLAY_SHA. Rebuilding."
            fi
          fi

          echo "Manifest check: version=$VERSION status=$STATUS force_version='$FORCE_VERSION' overlay_sha=$OVERLAY_SHA"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout OpenClaw source at v$VERSION
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.detect.outputs.version }}"
          # Releases API guarantees the v-prefixed tag exists. No fallback —
          # if this fails, fail the build instead of cloning HEAD silently.
          git clone --depth 1 --branch "v$VERSION" https://github.com/${{ env.UPSTREAM_REPO }}.git openclaw-src

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build upstream base image
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./openclaw-src
          push: true
          build-args: |
            OPENCLAW_EXTENSIONS=${{ env.EXTENSIONS }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base-${{ steps.detect.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build extended image with credit proxy
        if: steps.check.outputs.skip != 'true'
        id: build_extended
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base-${{ steps.detect.outputs.version }}
          # PR-1: auto-build pushes :<version> (immutable) and :candidate
          # (moving). NEVER :latest — only promote-openclaw-image.yml
          # rewrites :latest, gated by manual review.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.detect.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate
          # PR-2b #7: bake the overlay source SHA into the image as a
          # Docker label. The skip-check on the next run reads this back
          # via GHCR manifest/config blob lookup to decide whether to
          # rebuild. Pre-PR-2b builds carry no label → treated as
          # mismatched → rebuilt once. After that, the label is
          # authoritative.
          labels: |
            ai.buildclaws.overlay-sha=${{ steps.overlay.outputs.sha }}
            ai.buildclaws.upstream-version=${{ steps.detect.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve register endpoint
        if: steps.check.outputs.skip != 'true'
        id: register_endpoint
        run: |
          set -euo pipefail
          URL="${{ inputs.register_endpoint }}"
          if [ -z "$URL" ]; then
            URL="${{ env.DEFAULT_REGISTER_ENDPOINT }}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Using register endpoint: $URL"

      - name: Register OpenClawVersion (candidate)
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION_PIPELINE_SECRET: ${{ secrets.VERSION_PIPELINE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${VERSION_PIPELINE_SECRET:-}" ]; then
            echo "::error::secrets.VERSION_PIPELINE_SECRET is not set; cannot register OpenClawVersion candidate row."
            exit 1
          fi

          VERSION="${{ steps.detect.outputs.version }}"
          SOURCE_TAG="${{ steps.detect.outputs.source_tag }}"
          DOCKER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$VERSION"
          # docker/build-push-action@v5 exports `digest` as a step output — the
          # immutable sha256 of the pushed extended image.
          DIGEST="${{ steps.build_extended.outputs.digest }}"
          PUSHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          RELEASE_NOTES_URL="https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/$SOURCE_TAG"

          # Fail loud if the digest is missing — the register endpoint will
          # accept a null digest (the column is nullable) but we want the
          # provenance recorded for every pipeline-produced row.
          if [ -z "$DIGEST" ]; then
            echo "::error::build-push-action did not export a digest for the extended image. Cannot register a complete candidate row."
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg version       "$VERSION" \
            --arg dockerImage   "$DOCKER_IMAGE" \
            --arg imageDigest   "$DIGEST" \
            --arg buildSourceTag "$SOURCE_TAG" \
            --arg buildPushedAt "$PUSHED_AT" \
            --arg releaseNotesUrl "$RELEASE_NOTES_URL" \
            '{version: $version, dockerImage: $dockerImage, imageDigest: $imageDigest, buildSourceTag: $buildSourceTag, buildPushedAt: $buildPushedAt, releaseNotesUrl: $releaseNotesUrl, isStable: false, isCandidate: true}')

          echo "Posting register payload (truncated):"
          echo "$PAYLOAD" | jq -c .

          # -f makes curl exit non-zero on HTTP >=400 so the step fails the job.
          # --max-time bounds the call in case the endpoint hangs.
          HTTP_RESPONSE=$(curl -sS -f --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Pipeline-Secret: $VERSION_PIPELINE_SECRET" \
            -d "$PAYLOAD" \
            "${{ steps.register_endpoint.outputs.url }}")

          echo "Register response:"
          echo "$HTTP_RESPONSE" | jq .

      - name: Summary
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "### OpenClaw Runtime Image Built (candidate)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Upstream version:** \`${{ steps.detect.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Upstream tag:** \`${{ steps.detect.outputs.source_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Base image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base-${{ steps.detect.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Immutable tag:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.detect.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Candidate pointer:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate\` (NOT :latest)" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest:** \`${{ steps.build_extended.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Extensions:** ${{ env.EXTENSIONS }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Includes overlay:** process-manager.mjs, credit-proxy.mjs" >> $GITHUB_STEP_SUMMARY
          echo "- **Registered against:** ${{ steps.register_endpoint.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production deploys will NOT pick this up automatically. Run \`promote-openclaw-image.yml\` after QA to move \`:latest\`." >> $GITHUB_STEP_SUMMARY

      - name: Skipped summary
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "### Build Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Image \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.detect.outputs.version }}\` already exists in GHCR." >> $GITHUB_STEP_SUMMARY
