name: Runtime 9.4 contracts

# Clone-tag (R1–R15 symbols vs unsuffixed upstream_tag) + overlay image exec smoke.
# Overlay-source locks also run in unit-tests via runtime-contracts-r15.test.ts.

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: '20'
  OPENCLAW_CANDIDATE: '2026.9.4'
  REGISTRY: ghcr.io
  IMAGE_NAME: laxcorp-research/openclaw-runtime

jobs:
  clone-tag:
    name: Clone-tag contracts vs v2026.9.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Clone OpenClaw at unsuffixed upstream_tag
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${OPENCLAW_CANDIDATE}" https://github.com/openclaw/openclaw.git /tmp/openclaw # unsuffixed upstream_tag
      - name: Grep 9.4 contract symbols
        run: node scripts/runtime-contracts-clone-tag.mjs /tmp/openclaw "v${OPENCLAW_CANDIDATE}"

  exec-smoke:
    name: Rule-36 exec smoke inside 9.4 overlay image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.GHCR_READ_USER }}
          password: ${{ secrets.GHCR_READ_PAT }}
      - name: Pull 9.4 base and bake overlay
        run: |
          set -euo pipefail
          BASE="${REGISTRY}/${IMAGE_NAME}:base-${OPENCLAW_CANDIDATE}"
          docker pull "$BASE"
          docker build -f docker/Dockerfile --build-arg "BASE_IMAGE=$BASE" -t claws-overlay-94-ci .
      - name: Doctor --fix legacy volume + write smoke.md
        run: |
          set -euo pipefail
          vol="$(mktemp -d)"
          mkdir -p "$vol/agents/test-commander/sessions" \
                   "$vol/workspace-test-commander/shared/deliverables" \
                   "$vol/cron"
          cat > "$vol/openclaw.json" <<'JSON'
          {
            "gateway": { "mode": "local", "bind": "lan", "port": 18789 },
            "agents": {
              "ownership": "explicit",
              "defaults": { "systemAgent": { "agentId": "test-commander" } },
              "entries": {
                "test-commander": {
                  "name": "Test Commander",
                  "workspace": "/home/node/.openclaw/workspace-test-commander",
                  "model": "anthropic/claude-haiku-4-5-20251001"
                }
              }
            }
          }
          JSON
          echo '[]' > "$vol/cron/jobs.json"
          echo '{"agent:test-commander:main":"aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"}' > "$vol/agents/test-commander/sessions/sessions.json"
          echo '{}' > "$vol/agents/test-commander/sessions/aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa.jsonl"
          docker run --rm --user 0 \
            --entrypoint node \
            -e OPENCLAW_CONFIG_READONLY=1 \
            -e OPENCLAW_STATE_DIR=/home/node/.openclaw \
            -e OPENCLAW_DATA_DIR=/home/node/.openclaw \
            -v "$vol:/home/node/.openclaw" \
            claws-overlay-94-ci \
            /app/openclaw.mjs doctor --fix --non-interactive
          docker run --rm --user 0 \
            --entrypoint /bin/sh \
            -v "$vol:/home/node/.openclaw" \
            claws-overlay-94-ci \
            -c 'mkdir -p /home/node/.openclaw/workspace-test-commander/shared/deliverables && printf "# rule-36 exec smoke\n" > /home/node/.openclaw/workspace-test-commander/shared/deliverables/smoke.md'
          test -f "$vol/workspace-test-commander/shared/deliverables/smoke.md"
          echo "SMOKE_OK"
          # sqlite may land under agents/*/agent/ after doctor; fail closed if sessions.json remains as the store.
          if [ -f "$vol/agents/test-commander/sessions/sessions.json" ]; then
            echo "::error::sessions.json still present after doctor --fix (9.4 would refuse boot)"
            find "$vol" -type f | head -50
            exit 1
          fi
          if [ ! -f "$vol/agents/test-commander/agent/openclaw-agent.sqlite" ]; then
            echo "::error::openclaw-agent.sqlite missing after doctor --fix"
            find "$vol" -type f | head -50
            exit 1
          fi
